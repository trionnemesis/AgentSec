apiVersion: agentsec.dev/v1
kind: TargetAllowlist

# The only file in this repository that names a real endpoint or a credential
# variable. Review changes here the way you review firewall rules.
#
# Two properties are structural, not conventional:
#   * `production` is not a valid environment. There is no flag to add it.
#   * an http base_url must resolve to loopback or RFC1918 space unless the host
#     is listed in AGENTSEC_ALLOW_EXTERNAL_HOSTS.

targets:
  # ---------------------------------------------------------------------
  # Offline demo target. Everything is a recorded fixture, so `agentsec run`
  # works on a laptop with no agent, no Wazuh and no network. This is also
  # what CI uses to test the harness itself.
  # ---------------------------------------------------------------------
  - id: demo-agent-fixture
    description: Recorded fixtures for the four bundled scenarios.
    environment: local
    capabilities: [rag, tool_calling, memory, multi_tenant, email]
    max_risk_level: medium
    allow_destructive: false
    allowed_executors: [replay]
    adapter:
      kind: fixture
      fixture_dir: fixtures/demo-agent
    principals:
      tenant-a-user: DEMO_TENANT_A_TOKEN
      tenant-b-user: DEMO_TENANT_B_TOKEN
    evidence:
      otel:
        kind: file
        path: fixtures/demo-agent/{scenario_id}.otel.json
      wazuh:
        kind: file
        path: fixtures/demo-agent/{scenario_id}.wazuh.json
      tool_audit:
        kind: file
        path: fixtures/demo-agent/{scenario_id}.audit.json
      state_diff:
        kind: file
        path: fixtures/demo-agent/{scenario_id}.state.json
        collections: [orders, agent_memory, customers]

