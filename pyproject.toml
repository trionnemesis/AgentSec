[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsec"
version = "0.1.0"
description = "Purple-team harness for AI agents: Attack-Detection Contracts, deterministic verdicts, MCP gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "trionnemesis" }]
keywords = ["ai-security", "purple-team", "mcp", "wazuh", "opentelemetry", "llm-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

# Core deps only. Everything that touches an external system is an extra,
# so the deterministic core (schema -> run -> evaluate -> report) stays
# installable and testable on an air-gapped CI runner.
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "typer>=0.12",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
pyrit = ["pyrit>=0.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
all = ["agentsec[mcp,otel,dev]"]

[project.scripts]
agentsec = "agentsec.cli:main"
agentsec-mcp = "agentsec.mcp.server:main"

[project.urls]
Homepage = "https://github.com/trionnemesis/AgentSec"
Documentation = "https://github.com/trionnemesis/AgentSec/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsec"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "agentsec/_data/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests/conftest.py is importable as tests.conftest
addopts = "-q --strict-markers"
markers = [
  "integration: requires an external system (promptfoo, Wazuh, OTel backend)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["agentsec"]
mypy_path = "src"
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["agentsec", "tests"]
