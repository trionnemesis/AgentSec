name: skill-eval-static

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: skill-eval-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: reviewed skill integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Core dependencies only. This job has no model package, credential,
      # external harness or semantic judge and writes no result database.
      - run: pip install -e .

      - name: static Skill Assurance
        run: agentsec skill validate --profile static
