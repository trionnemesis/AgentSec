name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · types · tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately not installing the `mcp` extra. If the test suite ever
      # needs it, the gateway has stopped being a thin layer over the service.
      - run: pip install -e '.[dev]'

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest -q --cov=agentsec --cov-report=term-missing

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Audit the project metadata directly, so the result contains AgentSec's
      # resolved runtime dependencies rather than packages preinstalled on the
      # runner. A vulnerability is a failing job; there is no allow-failure flag.
      - name: pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: .

  self-check:
    name: harness runs against its own fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'

      - name: validate the scenario catalogue
        run: agentsec validate --strict

      - name: preview (no execution)
        run: agentsec preview --target demo-agent-fixture --profile pr

      # The fixture corpus is built to produce two blocking findings, so a
      # zero exit here means the evaluator stopped detecting them.
      - name: run and assert the expected exit code
        run: |
          set +e
          agentsec run --target demo-agent-fixture --profile nightly \
            --output junit --output-file results/agentsec.xml
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit 1 (two blocking findings), got $code"
            exit 1
          fi

      - name: html report
        run: agentsec report --target demo-agent-fixture --format html --format json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agentsec-self-check
          path: results/
          retention-days: 14

  mcp-gateway:
    name: gateway imports and binds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[mcp]'

      - run: pip install pytest

      - name: build the server without serving it
        run: |
          python - <<'PY'
          from agentsec.mcp.server import build_server
          server = build_server()
          print(f"gateway built: {server.name}")
          PY

      # These skip in the main job, which deliberately has no `mcp` extra. They
      # assert the wire contract matches the declared one, so they have to run
      # somewhere. Name every file holding such a test: one that skips in the
      # main job and is not collected here has never run at all, and reads as a
      # pass in both.
      - name: gateway contract reaches the wire
        run: pytest -q tests/test_mcp_gateway.py tests/test_packaging.py

      - name: read-only mode refuses execution
        env:
          AGENTSEC_MCP_READ_ONLY: "1"
        run: |
          python - <<'PY'
          from agentsec.errors import AgentSecError
          from agentsec.mcp.contract import tool_by_name
          from agentsec.mcp.server import _dispatch
          from agentsec.service.harness import HarnessService

          service = HarnessService(actor="ci")
          try:
              _dispatch(service, tool_by_name("agentsec_start_run"),
                        {"target_id": "demo-agent-fixture"})
          except AgentSecError as exc:
              assert "read-only" in exc.message, exc.message
              print("read-only mode refused start_run, as expected")
          else:
              raise SystemExit("read-only gateway executed a run")
          PY
